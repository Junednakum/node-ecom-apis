version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: node_ecom_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: node-ecom
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptechstack_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: node_ecom_api
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: mysql://root:root@db:3306/node-ecom
      JWT_SECRET: a_very_strong_random_secret_for_access_token_generation_123456
      JWT_REFRESH_SECRET: another_very_strong_random_secret_for_refresh_token_generation_7890
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX: 100
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_volume:/usr/src/app/public/uploads

volumes:
  mysql_data:
  uploads_volume:
